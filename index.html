<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light only">
<title>Knit Counter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@400;800&display=swap');

  :root {
    --pink: #f9a8d4;
    --lavender: #c4b5fd;
    --mint: #86efac;
    --sky: #7dd3fc;
    --cream: #fef9f0;
    --deep: #6b21a8;
    --text: #3b1f5e;
    --shadow: rgba(167,139,250,0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; color-scheme: light only; }

  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: var(--cream) !important;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* 背景デコ */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, #f9a8d4 0%, transparent 45%),
      radial-gradient(ellipse at 80% 15%, #d8b4fe 0%, transparent 45%),
      radial-gradient(ellipse at 80% 80%, #c4b5fd 0%, transparent 45%),
      radial-gradient(ellipse at 20% 80%, #f0abfc 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, #fce7f3 0%, transparent 60%);
    z-index: 0;
  }

  .deco-float {
    position: fixed;
    pointer-events: none;
    font-size: 2rem;
    opacity: 0.18;
    animation: floatDeco 8s ease-in-out infinite;
    z-index: 0;
  }
  .deco-float:nth-child(1) { top: 5%; left: 8%; animation-delay: 0s; font-size: 2.5rem; }
  .deco-float:nth-child(2) { top: 15%; right: 10%; animation-delay: 1.2s; }
  .deco-float:nth-child(3) { bottom: 20%; left: 6%; animation-delay: 2.4s; font-size: 1.8rem; }
  .deco-float:nth-child(4) { bottom: 8%; right: 8%; animation-delay: 0.8s; font-size: 2.8rem; }
  .deco-float:nth-child(5) { top: 50%; left: 3%; animation-delay: 3s; font-size: 1.5rem; }
  .deco-float:nth-child(6) { top: 40%; right: 4%; animation-delay: 1.8s; }

  @keyframes floatDeco {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-18px) rotate(5deg); }
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    max-width: 480px;
    padding: 20px;
    min-height: 100vh;
    justify-content: center;
  }

  /* タイトル */
  .title-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .sub-title {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.25em;
    background: linear-gradient(135deg, #f9a8d4, #c084fc, #818cf8);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleShimmer 4s ease infinite;
    opacity: 0.9;
  }

  .title {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    text-align: center;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
  }

  .title-text {
    background: linear-gradient(135deg, #d946ef, #a855f7, #ec4899, #818cf8);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleShimmer 4s ease infinite;
    filter: drop-shadow(0 2px 8px rgba(168,85,247,0.3));
  }

  .fairy {
    display: inline-block;
    animation: fairyBounce 2s ease-in-out infinite;
    font-style: normal;
  }
  .fairy:first-child { animation-delay: 0s; }
  .fairy:last-child  { animation-delay: 0.4s; }

  @keyframes titleShimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes fairyBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    40%       { transform: translateY(-6px) scale(1.15); }
    60%       { transform: translateY(-3px) scale(1.05); }
  }

  /* メインカード */
  .main-card-wrap {
    width: 100%;
    padding: 3px;
    border-radius: 30px;
    background: linear-gradient(135deg,
      #f9a8d4, #c4b5fd, #818cf8, #7dd3fc,
      #86efac, #fde68a, #fca5a5, #f9a8d4);
    background-size: 300% 300%;
    animation: rainbowBorder 5s linear infinite;
    box-shadow: 0 4px 24px var(--shadow);
  }

  @keyframes rainbowBorder {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .main-card {
    background: white;
    border-radius: 28px;
    padding: 36px 40px 32px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }

  /* ラベル */
  .counter-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: #a78bfa;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .counter-label select {
    border: 2px solid #e9d5ff;
    border-radius: 10px;
    padding: 4px 10px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--deep);
    background: #faf5ff;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }
  .counter-label select:focus { border-color: var(--lavender); }

  /* カウント表示 */
  .count-display {
    display: flex;
    align-items: baseline;
    gap: 8px;
    line-height: 1;
  }

  .count-number {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 7rem;
    color: var(--deep);
    transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), color 0.3s, text-shadow 0.3s;
    display: inline-block;
    letter-spacing: -0.02em;
  }

  .count-number.is-even {
    color: #f472b6;
    text-shadow: 0 4px 20px rgba(244,114,182,0.4);
  }

  .count-number.is-odd {
    color: #38bdf8;
    text-shadow: 0 4px 20px rgba(56,189,248,0.4);
  }

  .count-number.bump {
    transform: scale(1.08);
  }

  .count-unit {
    font-size: 1.2rem;
    color: #a78bfa;
    font-weight: 700;
  }

  /* 目標 */
  .goal-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: #9ca3af;
  }

  .goal-input {
    width: 64px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    padding: 3px 6px;
    font-family: inherit;
    font-size: 0.8rem;
    text-align: center;
    outline: none;
    color: var(--text);
    transition: border-color 0.2s;
  }
  .goal-input:focus { border-color: var(--lavender); }

  /* プログレスバー */
  .progress-wrap {
    width: 100%;
    height: 8px;
    background: #f3e8ff;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--pink), var(--lavender));
    transition: width 0.3s ease;
  }

  /* ボタンエリア */
  .btn-area {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .btn-main {
    flex: 1;
    padding: 18px;
    border: none;
    border-radius: 18px;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .btn-main:active { transform: scale(0.95); }

  .btn-up {
    background: #fb923c;
    color: white;
    box-shadow:
      0 4px 0 #c2410c,
      4px 0 0 rgba(251,146,60,0.3),
      -4px 0 0 rgba(251,146,60,0.3),
      0 8px 20px rgba(251,146,60,0.25);
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .btn-up:hover { filter: brightness(1.07); }
  .btn-up:active {
    box-shadow: 0 1px 0 #c2410c, inset 0 2px 4px rgba(0,0,0,0.15);
    transform: translateY(3px);
  }

  .btn-down {
    background: #34d399;
    color: white;
    box-shadow:
      0 4px 0 #047857,
      4px 0 0 rgba(52,211,153,0.3),
      -4px 0 0 rgba(52,211,153,0.3),
      0 8px 20px rgba(52,211,153,0.25);
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    flex: 0 0 auto;
    width: 80px;
    font-size: 1.5rem;
    padding: 18px 0;
  }
  .btn-down:hover { filter: brightness(1.07); }
  .btn-down:active {
    box-shadow: 0 1px 0 #047857, inset 0 2px 4px rgba(0,0,0,0.15);
    transform: translateY(3px);
  }

  .btn-label { font-size: 0.7rem; opacity: 0.85; letter-spacing: 0.05em; }

  @media (pointer: coarse) {
    .pc-only { display: none; }
    .btn-main {
      justify-content: center;
    }
    .btn-down {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  }

  /* リセット */
  .btn-reset {
    border: 2px solid #e5e7eb;
    background: white;
    border-radius: 12px;
    padding: 8px 18px;
    font-family: inherit;
    font-size: 0.78rem;
    color: #9ca3af;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 700;
  }
  .btn-reset:hover { border-color: #fca5a5; color: #f87171; }

  /* ヒント */
  .hint {
    font-size: 0.72rem;
    color: #c4b5fd;
    text-align: center;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #fdf2f8 !important; }
    body::before {
      background:
        radial-gradient(ellipse at 20% 20%, #f9a8d4 0%, transparent 45%),
        radial-gradient(ellipse at 80% 15%, #d8b4fe 0%, transparent 45%),
        radial-gradient(ellipse at 80% 80%, #c4b5fd 0%, transparent 45%),
        radial-gradient(ellipse at 20% 80%, #f0abfc 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, #fce7f3 0%, transparent 60%) !important;
    }
    .main-card { background: white !important; }
  }
  }

  .key-badge {
    display: inline-flex;
    align-items: center;
    background: #f3e8ff;
    border: 1.5px solid #d8b4fe;
    border-radius: 6px;
    padding: 1px 7px;
    font-size: 0.7rem;
    color: #7c3aed;
    font-weight: 700;
    box-shadow: 0 1px 0 #d8b4fe;
  }

  /* 履歴 */
  .history-card {
    background: white;
    border-radius: 20px;
    padding: 16px 20px;
    width: 100%;
    box-shadow: 0 2px 12px var(--shadow);
  }

  .history-title {
    font-size: 0.75rem;
    color: #a78bfa;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .history-chip {
    background: #faf5ff;
    border: 1.5px solid #e9d5ff;
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 0.75rem;
    color: var(--deep);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .history-chip:hover { background: #f3e8ff; border-color: #c4b5fd; }
  .history-chip .chip-del {
    color: #d1d5db;
    font-size: 0.65rem;
    font-weight: 900;
    line-height: 1;
  }
  .history-chip:hover .chip-del { color: #fca5a5; }

  /* 完了エフェクト */
  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }
  .confetti-piece {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 2px;
    animation: confettiFall 1.2s ease-in forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* 完了バナー */
  .done-banner {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: white;
    border-radius: 16px;
    padding: 12px 24px;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    box-shadow: 0 8px 24px rgba(168,85,247,0.4);
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
  }
  .done-banner.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="deco-float">🧶</div>
<div class="deco-float">🪡</div>
<div class="deco-float">✨</div>
<div class="deco-float">🌸</div>
<div class="deco-float">💜</div>
<div class="deco-float">⭐</div>

<div class="app">
  <div class="title-wrap">
    <span class="sub-title">✿ YUCCHI'S ✿</span>
    <div class="title">
      <span class="fairy">🧚</span>
      <span class="title-text">Knit Counter</span>
      <span class="fairy">🧚</span>
    </div>
  </div>

  <div class="main-card-wrap">
  <div class="main-card">
    <div class="counter-label">
      <span>カウント単位：</span>
      <select id="unitSelect">
        <option value="段">段</option>
        <option value="周">周</option>
        <option value="目">目</option>
        <option value="回">回</option>
      </select>
    </div>

    <div class="count-display">
      <span class="count-number" id="countNum">0</span>
      <span class="count-unit" id="countUnit">段目</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>

    <div class="goal-row">
      🎯 目標：
      <input class="goal-input" type="number" id="goalInput" placeholder="なし" min="1">
      <span id="goalStatus"></span>
    </div>

    <div class="btn-area">
      <button class="btn-main btn-up" id="btnUp" onclick="countUp()">
        <span>＋ カウント</span>
        <span class="btn-label pc-only">Space / Enter</span>
      </button>
      <button class="btn-main btn-down" id="btnDown" onclick="countDown()">－</button>
    </div>

    <button class="btn-reset" onclick="resetCount()">🔄 リセット</button>

    <div class="hint">
      <span class="key-badge">Space</span> または
      <span class="key-badge">Enter</span> で +1、
      <span class="key-badge">Backspace</span> で -1
    </div>
  </div>
  </div>

  <div class="history-card" id="historyCard" style="display:none">
    <div class="history-title">📌 ラップ記録</div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>
<div class="done-banner" id="doneBanner">🎉 目標達成！すごい！</div>

<script>
  let count = 0;
  let laps = [];
  let goalReached = false;

  const countNumEl = document.getElementById('countNum');
  const countUnitEl = document.getElementById('countUnit');
  const goalInput = document.getElementById('goalInput');
  const goalStatus = document.getElementById('goalStatus');
  const progressBar = document.getElementById('progressBar');
  const historyCard = document.getElementById('historyCard');
  const historyList = document.getElementById('historyList');
  const doneBanner = document.getElementById('doneBanner');
  const unitSelect = document.getElementById('unitSelect');

  // 保存・読み込み
  function saveData() {
    localStorage.setItem('kc_count', count);
    localStorage.setItem('kc_unit', getUnit());
    localStorage.setItem('kc_goal', goalInput.value);
    localStorage.setItem('kc_laps', JSON.stringify(laps));
  }

  function loadData() {
    const savedCount = localStorage.getItem('kc_count');
    const savedUnit  = localStorage.getItem('kc_unit');
    const savedGoal  = localStorage.getItem('kc_goal');
    const savedLaps  = localStorage.getItem('kc_laps');
    if (savedCount !== null) count = parseInt(savedCount);
    if (savedUnit)  unitSelect.value = savedUnit;
    if (savedGoal)  goalInput.value = savedGoal;
    if (savedLaps)  { laps = JSON.parse(savedLaps); renderHistory(); }
  }

  unitSelect.addEventListener('change', () => { updateDisplay(); saveData(); });
  goalInput.addEventListener('input', () => { updateDisplay(); saveData(); });

  function getUnit() { return unitSelect.value; }

  function updateDisplay() {
    const u = getUnit();
    countNumEl.textContent = count;
    countUnitEl.textContent = u + '目';

    // 偶数ピンク・奇数水色
    countNumEl.classList.remove('is-even', 'is-odd');
    if (count % 2 === 0) {
      countNumEl.classList.add('is-even');
    } else {
      countNumEl.classList.add('is-odd');
    }

    const goal = parseInt(goalInput.value);
    if (goal > 0) {
      const pct = Math.min(100, (count / goal) * 100);
      progressBar.style.width = pct + '%';
      if (count >= goal) {
        goalStatus.textContent = '✅ 達成！';
        if (!goalReached) {
          goalReached = true;
          showConfetti();
          showDoneBanner();
        }
      } else {
        goalStatus.textContent = `残り ${goal - count}${u}`;
        goalReached = false;
      }
    } else {
      progressBar.style.width = '0%';
      goalStatus.textContent = '';
    }
  }

  function bump() {
    countNumEl.classList.remove('bump');
    void countNumEl.offsetWidth;
    countNumEl.classList.add('bump');
    setTimeout(() => countNumEl.classList.remove('bump'), 200);
  }

  function countUp() {
    count++;
    bump();
    updateDisplay();
    saveData();
  }

  function countDown() {
    if (count <= 0) return;
    count--;
    bump();
    updateDisplay();
    saveData();
  }

  function resetCount() {
    if (count > 0) {
      laps.push({ count, unit: getUnit(), time: new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) });
      renderHistory();
    }
    count = 0;
    goalReached = false;
    updateDisplay();
    saveData();
  }

  function renderHistory() {
    historyCard.style.display = 'block';
    historyList.innerHTML = '';
    laps.slice().reverse().forEach((lap, i) => {
      const chip = document.createElement('div');
      chip.className = 'history-chip';
      chip.innerHTML = `<span>${lap.count}${lap.unit} <small style="color:#c4b5fd">${lap.time}</small></span><span class="chip-del" onclick="deleteLap(${laps.length-1-i})">✕</span>`;
      historyList.appendChild(chip);
    });
    if (laps.length === 0) historyCard.style.display = 'none';
  }

  function deleteLap(idx) {
    laps.splice(idx, 1);
    renderHistory();
  }

  function showConfetti() {
    const wrap = document.getElementById('confettiWrap');
    wrap.innerHTML = '';
    const colors = ['#f9a8d4','#c4b5fd','#86efac','#7dd3fc','#fde68a','#fca5a5'];
    for (let i = 0; i < 60; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.cssText = `
        left: ${Math.random()*100}%;
        top: -10px;
        background: ${colors[Math.floor(Math.random()*colors.length)]};
        animation-delay: ${Math.random()*0.8}s;
        animation-duration: ${0.8 + Math.random()*0.8}s;
        width: ${6+Math.random()*6}px;
        height: ${6+Math.random()*6}px;
        border-radius: ${Math.random()>0.5?'50%':'2px'};
      `;
      wrap.appendChild(p);
    }
    setTimeout(() => wrap.innerHTML = '', 2000);
  }

  function showDoneBanner() {
    doneBanner.classList.add('show');
    setTimeout(() => doneBanner.classList.remove('show'), 2500);
  }

  // キーボード操作
  document.addEventListener('keydown', (e) => {
    if (e.target === goalInput || e.target === unitSelect) return;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      countUp();
    } else if (e.key === 'Backspace' || e.key === 'ArrowDown') {
      e.preventDefault();
      countDown();
    } else if (e.key === 'r' || e.key === 'R') {
      resetCount();
    }
  });

  loadData();
  updateDisplay();
</script>
</body>
</html>
